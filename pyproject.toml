[project]
name = "kopis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14",
    "aiohttp-session>=2.12.1",
    "aiohttp-sse>=3.0",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The installed module is the server-side `kopis` module. The client-side
# `kopis` module (src/client/kopis.py) is not importable by CPython: it
# runs in the browser under Brython and is served to it over HTTP by the
# server (see Kopis(use="brython")).
[tool.hatch.build.targets.wheel]
packages = ["src/server/kopis.py"]

[dependency-groups]
dev = [
    "brython>=3.15.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff.lint]
ignore = ["I001"]

[tool.ty.analysis]
allowed-unresolved-imports = ["browser", "javascript"]
