[project]
name = "kopis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14",
    "aiohttp-session>=2.12.1",
    "beautifulsoup4>=4.15.0",
    "cryptography>=50.0.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "brython>=3.15.0",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff.lint]
ignore = ["I001"]
