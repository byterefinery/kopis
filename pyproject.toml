[project]
name = "kopis"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14",
    "aiohttp-session>=2.12.1",
    "cryptography>=50.0.2",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

# The `kopis` package (src/kopis) differentiates the server and client
# sides in its __init__.py: the server side (kopis.server) runs on CPython,
# the client side (kopis.client) runs in the browser under Brython and is
# served to it over HTTP by the server (see Kopis(use="brython")).

[dependency-groups]
dev = [
    "brython>=3.14.0,<3.15",
    "playwright>=1.64.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ruff]
# The vendored agent skills under .agents/ are reference docs, not code.
extend-exclude = [".agents"]

[tool.ruff.lint]
# B015 (pointless comparison) cannot see through the overloaded `<=`
# operator, which in this codebase is the brython-style DOM append.
# SIM117 (combine nested with statements) cannot see that a nested
# `with element:` block of DOM elements is a nesting level (the inner
# element is the parent of the outer's body), not a group.
ignore = ["B015", "I001", "SIM117"]

[tool.ty.analysis]
allowed-unresolved-imports = ["browser", "javascript"]
